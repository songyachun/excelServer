<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 数据导入</title>
    <link rel="stylesheet" href="lib/element-plus.css" />
    <style>
        [v-cloak] { display: none !important; }
        body { margin: 0; background: #f5f7fa; }
        #app { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .toolbar .info { color: #909399; font-size: 13px; }
        .table-wrap { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .no-data { text-align: center; padding: 60px 0; color: #c0c4cc; }
        .no-data .icon { font-size: 48px; margin-bottom: 12px; }
        .no-data p { margin: 0; font-size: 14px; }
        .server-badge { font-size: 12px; background: #67c23a; color: #fff; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <!-- 工具栏 -->
        <div class="toolbar">
            <el-upload
                :auto-upload="false"
                accept=".xlsx,.xls"
                :on-change="handleFileChange"
                :show-file-list="false"
            >
                <el-button type="primary">导入 Excel</el-button>
            </el-upload>
            <el-button @click="clearData" :disabled="!tableData.length">清空数据</el-button>
            <el-input
                v-model="searchQuery"
                placeholder="模糊搜索所有字段..."
                clearable
                style="width: 280px"
                prefix-icon="Search"
            />
            <span class="info">
                {{ filteredData.length }} / {{ tableData.length }} 条记录
                <template v-if="sheetName">（{{ sheetName }}）</template>
            </span>
            <span v-if="isServerMode" class="server-badge">服务端模式</span>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrap">
            <div v-if="tableData.length === 0" class="no-data">
                <div class="icon">📂</div>
                <p>导入 Excel，数据将自动保存到项目目录 data.json</p>
            </div>
            <template v-if="tableData.length > 0">
                <el-table
                    :data="pageData"
                    border
                    stripe
                    max-height="650"
                    style="width: 100%"
                >
                    <el-table-column
                        v-for="col in columns"
                        :key="col.prop"
                        :prop="col.prop"
                        :label="col.label"
                        min-width="120"
                        show-overflow-tooltip
                    />
                </el-table>
                <div style="display: flex; justify-content: center; margin-top: 16px;">
                    <el-pagination
                        v-model:page-size="pageSize"
                        v-model:current-page="currentPage"
                        :total="filteredData.length"
                        :page-sizes="[20, 50, 100, 200]"
                        layout="total, sizes, prev, pager, next, jumper"
                        background
                    />
                </div>
            </template>
        </div>
    </div>

    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/element-plus.umd.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const STORAGE_KEY = 'excel_import_data';
        const PAGE_SIZE_KEY = 'excel_page_size';

        // 从 localStorage 读取
        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        }

        // 保存到 localStorage
        function saveToStorage(data, sheetName) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ data, sheetName, savedAt: Date.now() }));
        }

        const app = createApp({
            setup() {
                const tableData = ref([]);
                const columns = ref([]);
                const sheetName = ref('');
                const searchQuery = ref('');
                const isServerMode = ref(false);

                const currentPage = ref(1);
                const pageSize = ref(Number(localStorage.getItem(PAGE_SIZE_KEY)) || 50);

                const filteredData = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return tableData.value;
                    return tableData.value.filter(row =>
                        Object.values(row).some(val =>
                            val !== null && val !== undefined && String(val).toLowerCase().includes(q)
                        )
                    );
                });

                const pageData = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    return filteredData.value.slice(start, start + pageSize.value);
                });

                function resetPage() { currentPage.value = 1; }

                const { watch } = Vue;
                watch(pageSize, (val) => {
                    localStorage.setItem(PAGE_SIZE_KEY, val);
                    resetPage();
                });
                watch(searchQuery, () => { resetPage(); });

                // -------- 解析 Excel --------
                function parseExcel(worksheet) {
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    let headerIdx = -1, maxCols = 0;
                    for (let i = 0; i < rows.length; i++) {
                        const r = rows[i];
                        if (!r) continue;
                        const count = r.filter(c => c !== null && c !== undefined && c !== '').length;
                        if (count > maxCols) { maxCols = count; headerIdx = i; }
                    }
                    if (headerIdx === -1) return [];

                    const headers = rows[headerIdx];
                    const result = [];
                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (!r || r.every(c => c === null || c === undefined || c === '')) continue;
                        if (r.length <= 2 && typeof r[0] === 'string' && r[0].startsWith('#')) continue;
                        const obj = {};
                        headers.forEach((h, idx) => {
                            if (h !== null && h !== undefined && h !== '') {
                                obj[h] = idx < r.length ? r[idx] : null;
                            }
                        });
                        result.push(obj);
                    }
                    return result;
                }

                // -------- 服务端 API --------
                async function tryLoadFromServer() {
                    try {
                        const res = await fetch('/api/data');
                        if (!res.ok) return false;
                        const payload = await res.json();
                        const data = payload.data || payload;
                        if (!Array.isArray(data) || data.length === 0) return false;
                        columns.value = Object.keys(data[0]).map(k => ({ prop: k, label: k }));
                        tableData.value = data;
                        sheetName.value = payload.sheetName || 'data';
                        isServerMode.value = true;
                        return true;
                    } catch { return false; }
                }

                async function saveToServer(data, name) {
                    try {
                        const payload = {
                            sheetName: name,
                            exportedAt: new Date().toISOString(),
                            total: data.length,
                            data: data
                        };
                        const res = await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) isServerMode.value = true;
                    } catch { /* 服务端不可用，忽略 */ }
                }

                async function clearServerData() {
                    try {
                        await fetch('/api/data', { method: 'DELETE' });
                    } catch { /* 忽略 */ }
                }

                // -------- 初始化 --------
                onMounted(async () => {
                    // 优先从服务端加载（启动时自动读 data.json）
                    const loaded = await tryLoadFromServer();
                    if (!loaded) {
                        // 回退到 localStorage
                        const stored = loadFromStorage();
                        if (stored && stored.data && stored.data.length) {
                            columns.value = Object.keys(stored.data[0]).map(k => ({ prop: k, label: k }));
                            tableData.value = stored.data;
                            sheetName.value = stored.sheetName || '';
                        }
                    }
                });
                // -------- 事件处理 --------
                const handleFileChange = (uploadFile) => {
                    const file = uploadFile.raw;
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const name = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[name];
                            const jsonData = parseExcel(worksheet);

                            if (jsonData.length === 0) {
                                ElementPlus.ElMessage.warning('未识别到有效数据');
                                return;
                            }

                            columns.value = Object.keys(jsonData[0]).map(k => ({ prop: k, label: k }));
                            tableData.value = jsonData;
                            sheetName.value = name;
                            resetPage();

                            // 保存到服务端（自动写入项目目录 data.json）
                            await saveToServer(jsonData, name);
                            // 同时保存到 localStorage 作为备份
                            saveToStorage(jsonData, name);

                            ElementPlus.ElMessage.success(`成功导入 ${jsonData.length} 条记录`);
                        } catch (err) {
                            ElementPlus.ElMessage.error('文件解析失败：' + err.message);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                };

                const clearData = () => {
                    tableData.value = [];
                    columns.value = [];
                    sheetName.value = '';
                    searchQuery.value = '';
                    localStorage.removeItem(STORAGE_KEY);
                    clearServerData();
                    resetPage();
                    ElementPlus.ElMessage.info('数据已清空');
                };

                return { tableData, columns, sheetName, searchQuery, filteredData, pageData, currentPage, pageSize, isServerMode, handleFileChange, clearData };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
