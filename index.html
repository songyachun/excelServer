<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广谱抗病毒化合物库·本地查询系统</title>
    <link rel="stylesheet" href="lib/element-plus.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="app" v-cloak>
        <!-- 页面标题 -->
        <div class="page-header">
            <div class="icon">🧬</div>
            <h1>广谱抗病毒化合物库·本地查询系统</h1>
            <div class="header-right">
                <span class="sub">Local Compound Database</span>
                <div class="theme-btn" @click="toggleThemePanel" ref="themeBtnRef">
                    <span v-html="themeIcon"></span>
                    <div class="theme-tooltip" :class="{ open: themePanelOpen }" @click.stop>
                        <div v-for="t in themes" :key="t.id"
                            class="theme-tooltip-item"
                            :class="{ active: currentTheme === t.id }"
                            @click="setTheme(t.id)"
                            :title="t.name"
                            v-html="t.icon">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 工具栏 -->
        <div class="toolbar">
            <el-upload :auto-upload="false" accept=".xlsx,.xls" :on-change="handleFileChange" :show-file-list="false">
                <el-button type="primary">导入 Excel</el-button>
            </el-upload>
            <el-button @click="showAddDialog" :disabled="!columns.length">新增</el-button>
            <el-button @click="deleteSelected" :disabled="!selectedRows.length" type="danger">删除选中</el-button>
            <el-button @click="clearData" :disabled="!tableData.length">清空数据</el-button>
            <el-button @click="logDialogVisible = true" :disabled="!logs.length" style="margin-left:auto">操作日志</el-button>
        </div>
        <div class="toolbar">
            <el-input v-model="searchQuery" placeholder="搜索你想要的内容" clearable style="flex:1;height:42px"
                prefix-icon="Search" />
            <span class="info">
                {{ filteredData.length }} / {{ tableData.length }} 条记录
                <template v-if="sheetName">（{{ sheetName }}）</template>
            </span>
            <span v-if="isServerMode" class="server-badge">服务端模式</span>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrap">
            <div v-if="tableData.length === 0" class="no-data">
                <div class="icon">📂</div>
                <p>导入 Excel，数据将自动保存到项目目录 data.json</p>
            </div>
            <template v-if="tableData.length > 0">
                <el-table ref="multipleTableRef" :data="pageData" border :max-height="tableHeight" style="width: 100%"
                    :row-key="getRowKey">
                    <!-- <el-table-column type="selection" width="55" reserve-selection /> -->
                    <el-table-column v-for="col in columns.filter(item => item.prop !== 'id')" :key="col.prop"
                        :prop="col.prop" :label="col.label" min-width="120" show-overflow-tooltip>
                        <template #default="{ row }">
                            <span v-html="highlightText(row[col.prop])" />
                        </template>
                    </el-table-column>
                </el-table>
                <div style="display: flex; justify-content: center; margin-top: 16px;">
                    <el-pagination v-model:page-size="pageSize" v-model:current-page="currentPage"
                        :total="filteredData.length" :page-sizes="[20, 50, 100, 200]"
                        layout="total, sizes, prev, pager, next, jumper" background />
                </div>
            </template>
        </div>

        <!-- 手动新增对话框 -->
        <el-dialog v-model="addDialogVisible" title="手动新增" width="min(90vw, 800px)" :close-on-click-modal="false">
            <el-form ref="addFormRef" :model="addForm" label-width="100px" class="grid-form">
                <el-form-item v-for="col in columns.filter(item => item.prop !== 'id')" :key="col.prop"
                    :label="col.label">
                    <el-input v-model="addForm[col.prop]" :placeholder="'请输入 ' + col.label" clearable />
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="addDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmAdd">确定</el-button>
            </template>
        </el-dialog>

        <!-- 操作日志对话框 -->
        <el-dialog v-model="logDialogVisible" title="操作日志" width="700px">
            <el-table :data="logs" max-height="460" size="small" border>
                <el-table-column prop="time" label="时间" width="160" />
                <el-table-column prop="action" label="操作" width="100" />
                <el-table-column prop="detail" label="详情" min-width="200" />
                <el-table-column label="数据变化" width="130">
                    <template #default="{ row }">
                        {{ row.beforeCount }} → {{ row.afterCount }} 条
                    </template>
                </el-table-column>
            </el-table>
        </el-dialog>
    </div>
    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/element-plus.umd.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
